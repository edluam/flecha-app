<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<link rel="manifest" href="manifest.json">
<title>ADS-T100 · Flecha techos</title>
<!--
  App del móvil del captador de flecha (VA074, techos suspendidos).
  Recibe del ESP32, por Bluetooth LE (servicio UART de Nordic), una línea por
  segundo «seq;cociente;mm;estado». El operario marca a mano el escalón de
  carga; al terminar, exporta el TXT que lee app/ensayos/techos_suspendidos.py:
      # Zona 1: Sala de espera
      Tiempo_s;Fuerza_kg;Deformacion_mm
      0;5;0,000
  Web Bluetooth solo funciona en Chrome de Android y desde HTTPS. Tras la
  primera carga, sw.js la deja guardada y funciona sin internet.
  Modo demostración: añadir ?demo a la dirección (simula el captador).
-->
<style>
:root{--fondo:#f4f5f7;--txt:#1f2933;--gris:#7b8794;--tarjeta:#fff;--azul:#2563eb;--verde:#15803d;--ambar:#b45309;--rojo:#b91c1c;--borde:#d9dde3}
@media (prefers-color-scheme:dark){:root{--fondo:#111418;--txt:#e6e8eb;--gris:#9aa5b1;--tarjeta:#1c2127;--borde:#323a44}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--txt);font:16px/1.35 system-ui,-apple-system,Roboto,sans-serif;padding:12px 12px 90px}
h1{font-size:18px;margin:0 0 8px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:10px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:13px;color:var(--gris);display:block;margin-bottom:2px}
input,select{font:inherit;padding:8px;border:1px solid var(--borde);border-radius:8px;width:100%;background:var(--fondo);color:var(--txt)}
.campo{flex:1 1 120px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;background:var(--azul);color:#fff}
button.sec{background:var(--borde);color:var(--txt)}
button.rojo{background:var(--rojo)}
button:disabled{opacity:.4}
#lectura{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px}
#estado{text-align:center;font-size:14px;color:var(--gris)}
#panel{transition:background .3s}
#ruidoCaja{margin-top:10px}
#ruidoTxt{font-weight:700;text-align:center;font-size:15px}
#ruidoBarra{position:relative;height:26px;border-radius:8px;background:var(--borde);margin-top:6px;overflow:hidden;border:1px solid var(--borde)}
#ruidoNivel{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gris);transition:width .4s,background .4s}
#ruidoLimite{position:absolute;top:0;bottom:0;width:2px;background:var(--txt);opacity:.7}
#ruidoEscala{position:relative;height:16px;font-size:11px;color:var(--gris);font-variant-numeric:tabular-nums}
#ruidoEscala span{position:absolute;transform:translateX(-50%)}
#panel.estable{background:#dcfce7}#panel.moviendo{background:#fef3c7}
@media (prefers-color-scheme:dark){#panel.estable{background:#12351f}#panel.moviendo{background:#3a2c0b}}
.escalones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.escalones button{padding:14px 0;background:var(--borde);color:var(--txt)}
.escalones button.actual{background:var(--azul);color:#fff}
.escalones button.hecho{background:var(--verde);color:#fff}
#grande{width:100%;font-size:22px;padding:18px;margin-top:8px}
.datos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.datos b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.datos span{font-size:12px;color:var(--gris)}
canvas{width:100%;height:180px;display:block}
.aviso{color:var(--ambar);font-size:14px;margin:6px 0 0}
#barra{position:fixed;left:0;right:0;bottom:0;background:var(--tarjeta);border-top:1px solid var(--borde);padding:10px 12px;display:flex;gap:8px}
#barra button{flex:1}
.marca{margin:-6px 0 10px;font-size:12px;color:var(--gris)}
</style>
</head>
<body>
<h1>Prueba de carga · techos suspendidos</h1>
<p class="marca">AlchiDat System™ · ADS-T100 · © 2026 Eduardo Álvarez Chirino</p>

<div class="tarjeta">
  <div class="fila">
    <button id="bConectar">Conectar captador</button>
    <span id="conexion" style="font-size:14px;color:var(--gris)">Sin conectar</span>
  </div>
  <p class="aviso" id="avisoCal" hidden></p>
</div>

<div class="tarjeta">
  <div class="fila">
    <div class="campo"><label>Nº de obra</label><input id="obra" inputmode="numeric"></div>
    <div class="campo"><label>Zona nº</label><input id="zona" inputmode="numeric" value="1"></div>
  </div>
  <div class="fila" style="margin-top:6px">
    <div class="campo" style="flex-basis:100%"><label>Localización</label><input id="local" placeholder="Sala de espera"></div>
  </div>
  <div class="fila" style="margin-top:8px">
    <button class="sec" id="bCabecera">Guardar datos</button>
    <span id="cabEstado" style="font-size:14px"></span>
  </div>
</div>

<div class="tarjeta" id="panel">
  <div id="lectura">––</div>
  <div id="estado">mm · esperando lecturas</div>
  <div id="avisoCero" style="text-align:center;font-size:15px;font-weight:600;margin-top:4px"></div>
  <div id="ruidoCaja">
    <div id="ruidoTxt">Ruido: –</div>
    <div id="ruidoBarra"><div id="ruidoNivel"></div><div id="ruidoLimite"></div></div>
    <div id="ruidoEscala"></div>
  </div>
  <div class="datos" style="margin-top:8px">
    <div><b id="dCarga">–</b><span>carga kg</span></div>
    <div><b id="dTiempo">–</b><span>en escalón</span></div>
    <div><b id="dVar">–</b><span>ruido 30 s (mm)</span></div>
  </div>
</div>

<div class="tarjeta">
  <label>Escalones (toca uno para saltar a él)</label>
  <div class="escalones" id="escalones"></div>
  <button id="grande" disabled>Empezar: colgar 5 kg</button>
  <div class="fila" style="margin-top:8px">
    <div class="campo"><label for="umbral">Ruido 20 equivale a (mm en 30 s)</label><input id="umbral" inputmode="decimal" value="0,02"></div>
    <div class="campo"><label for="espera">Si no se estabiliza, pasar a los (min)</label><input id="espera" inputmode="decimal" value="5"></div>
  </div>
  <p class="aviso" id="avisoPaso"></p>
</div>

<div class="tarjeta"><canvas id="grafica"></canvas></div>

<div id="barra">
  <button class="sec" id="bExportar" disabled>Exportar TXT</button>
  <button class="sec" id="bAbortar">Abortar y repetir</button>
  <button class="rojo" id="bNuevo">Nueva zona</button>
</div>

<script>
"use strict";
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const PROGRAMA = [5, 15, 25, 15, 5];
const VENTANA_S = 30, DURACION_S = 180;
// Para pasar de escalón: ruido (máx − mín de los últimos 30 s) <= umbral, o que
// el escalón dure ya la espera máxima. Se guardan en el móvil entre ensayos.
let AJ = {umbral: 0.02, espera: 5, modoCero: "30s"};
try { Object.assign(AJ, JSON.parse(localStorage.getItem("flechaAjustes")) || {}); } catch(e){}
const RUIDO_PASA = 20;   // en la escala 0-100 de la barra, el umbral cae en 20
function indiceRuido(v){ return Math.min(100, RUIDO_PASA * v / AJ.umbral); }
function num(t){ const x = parseFloat(String(t).replace(",", ".")); return isFinite(x) && x > 0 ? x : null; }
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- estado
let E = cargar() || nuevoEnsayo();
let ultimo = null, rx = null, bufer = "", info = "";
function nuevoEnsayo(){ return {inicio:null, escalon:-1, tEscalon:null, cero:null, filas:[], perdidas:0, ultSeq:null, modoCero: AJ.modoCero || "30s"}; }
const CERO_S = 30;   // el cero automático se pone a los 30 s de empezar el escalón de 5 kg
// El cero se pone siempre a los 30 s de empezar el escalón de 5 kg (también en registros antiguos).
function modoCero(){ return "30s"; }
function ponerCero(ahora){ E.cero = ultimo; E.tCero = Math.round(ahora - E.inicio); if (navigator.vibrate) navigator.vibrate([100,60,100]); }
function guardar(){ try{ localStorage.setItem("flecha", JSON.stringify({E, obra:$("obra").value, zona:$("zona").value, local:$("local").value})); }catch(e){} }
function cargar(){
  try{ const g = JSON.parse(localStorage.getItem("flecha")); if(!g) return null;
    setTimeout(()=>{ $("obra").value=g.obra||""; $("zona").value=g.zona||"1"; $("local").value=g.local||""; },0);
    return g.E; }catch(e){ return null; }
}

// ------------------------------------------------------------- Bluetooth
$("bConectar").onclick = async () => {
  if (location.search.includes("demo")) { demo(); return; }
  if (!navigator.bluetooth) { alert("Este navegador no tiene Bluetooth web. Usa Chrome en Android y abre la app desde su dirección https."); return; }
  try {
    const disp = await navigator.bluetooth.requestDevice({filters:[{namePrefix:"ADS-T100"},{namePrefix:"FLECHA"}], optionalServices:[NUS]});
    disp.addEventListener("gattserverdisconnected", () => { conexion("Desconectado · reconectando…", true); reconectar(disp); });
    await enlazar(disp);
  } catch (e) { conexion("No conectado: " + e.message, true); }
};
async function enlazar(disp){
  const srv = await disp.gatt.connect();
  const s = await srv.getPrimaryService(NUS);
  const tx = await s.getCharacteristic(NUS_TX);
  rx = await s.getCharacteristic(NUS_RX);
  tx.addEventListener("characteristicvaluechanged", ev => recibir(new TextDecoder().decode(ev.target.value)));
  await tx.startNotifications();
  conexion("Conectado a " + disp.name);
  pedirInfo();
}
// Pide los datos del captador (versión, calibración, signo) hasta que llegan:
// a veces la primera petición se pierde justo al conectar.
async function pedirInfo(){
  const antes = info;
  info = "";
  for (let i = 0; i < 6 && !info; i++) {
    try { await rx.writeValue(new TextEncoder().encode("INFO\n")); } catch(e){}
    await new Promise(r => setTimeout(r, 1500));
  }
  if (!info) info = antes;
}
async function reconectar(disp){
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try { await enlazar(disp); return; } catch(e){}
  }
  conexion("Perdido. Pulsa Conectar.", true);
}
function conexion(t, mal){ $("conexion").textContent = t; $("conexion").style.color = mal ? "var(--rojo)" : "var(--verde)"; }

function recibir(trozo){
  bufer += trozo;
  let i;
  while ((i = bufer.indexOf("\n")) >= 0) { linea(bufer.slice(0, i).trim()); bufer = bufer.slice(i + 1); }
}
function linea(l){
  if (!l) return;
  if (l.startsWith("#INFO")) {
    info = l.slice(1);
    const sinCal = l.includes("SIN_CALIBRAR");
    $("avisoCal").hidden = !sinCal;
    $("avisoCal").textContent = "El captador no tiene calibración cargada: las lecturas son nominales.";
    return;
  }
  const [seq, q, mm, est] = l.split(";");
  const n = parseInt(seq, 10);
  if (E.ultSeq !== null && n > E.ultSeq + 1 && E.inicio !== null) E.perdidas += n - E.ultSeq - 1;
  E.ultSeq = n;
  if (mm === "" || mm === undefined) { $("estado").textContent = "captador sin dato (" + est + ")"; return; }
  lectura(parseFloat(mm));
}

// ----------------------------------------------------------------- ensayo
function lectura(mmAbs){
  ultimo = mmAbs;
  const ahora = Date.now() / 1000;
  if (modoCero() === "30s" && E.cero === null && E.escalon === 0 && ahora - E.tEscalon >= CERO_S) ponerCero(ahora);
  if (E.inicio !== null && E.escalon >= 0 && E.escalon < PROGRAMA.length) {
    E.filas.push([Math.round(ahora - E.inicio), PROGRAMA[E.escalon], mmAbs]);
    guardar();
  }
  pintar();
}
function flechaRel(mmAbs){ return E.cero === null ? 0 : mmAbs - E.cero; }

function irAEscalon(k){
  const ahora = Date.now() / 1000;
  if (E.escalon >= 0 && k > E.escalon) {
    const p = puedePasar();
    if (!p.ok) { alert("Todavía no: " + p.motivo); return; }
    if (p.forzado) (E.forzados = E.forzados || []).push([PROGRAMA[E.escalon], E.escalon + 1, p.ruido]);
  }
  if (E.inicio === null) E.inicio = ahora;
  // cero a los 30 s del escalón de 5 kg (si se sale antes, al salir), o al terminar la precarga
  if (E.cero === null && ultimo !== null && E.escalon === 0 && k >= 1) ponerCero(ahora);
  E.escalon = k; E.tEscalon = ahora;
  if (navigator.vibrate) navigator.vibrate(80);
  guardar(); pintar();
}
$("grande").onclick = () => {
  if (E.escalon < PROGRAMA.length - 1) irAEscalon(E.escalon + 1);
  else { E.escalon = PROGRAMA.length; guardar(); pintar(); }
};

function variacion(){
  const f = E.filas.filter(r => r[1] === PROGRAMA[E.escalon]);
  if (f.length < 2) return null;
  const tf = f[f.length - 1][0];
  const dentro = f.filter(r => r[0] >= tf - VENTANA_S);
  if (tf - dentro[0][0] < VENTANA_S - 1) return null;
  const v = dentro.map(r => r[2]);
  return Math.max(...v) - Math.min(...v);
}
function puedePasar(){
  if (E.escalon < 0 || E.escalon >= PROGRAMA.length) return {ok:true};
  const dt = Date.now()/1000 - E.tEscalon, r = variacion(), esperaS = AJ.espera * 60;
  if (r !== null && r <= AJ.umbral) return {ok:true, ruido:r};
  if (dt >= esperaS) return {ok:true, forzado:true, ruido:r};
  const falta = Math.ceil(esperaS - dt), mmss = Math.floor(falta/60) + ":" + String(falta%60).padStart(2,"0");
  return {ok:false, falta: mmss, motivo: r === null
    ? "midiendo el ruido (hacen falta 30 s de lecturas)"
    : "ruido " + indiceRuido(r).toFixed(0) + ", tiene que bajar a " + RUIDO_PASA + " o menos. Se podrá pasar igualmente en " + mmss};
}

function pintar(){
  $("lectura").textContent = ultimo === null ? "––" : fmt(E.cero === null ? ultimo : flechaRel(ultimo), 3);
  $("estado").textContent = E.cero === null ? "mm · lectura absoluta (sin cero)" : "mm · flecha desde el cero" + (E.perdidas ? " · " + E.perdidas + " s perdidos" : "");
  let pendiente;
  if (modoCero() === "precarga") pendiente = "Cero pendiente: se pondrá al pasar de 5 a 15 kg";
  else if (E.escalon === 0) pendiente = "Poniendo cero en " + Math.max(0, Math.ceil(CERO_S - (Date.now()/1000 - E.tEscalon))) + " s…";
  else pendiente = "Cero pendiente: se pondrá a los " + CERO_S + " s de colgar 5 kg";
  $("avisoCero").textContent = E.cero === null ? pendiente
    : "✓ Cero puesto " + (modoCero() === "30s" ? "a los " + CERO_S + " s del escalón de 5 kg" : "al acabar la precarga");
  $("avisoCero").style.color = E.cero === null ? "var(--ambar)" : "var(--verde)";
  const enCurso = E.escalon >= 0 && E.escalon < PROGRAMA.length;
  $("dCarga").textContent = enCurso ? PROGRAMA[E.escalon] : "–";
  const dt = enCurso ? Math.round(Date.now()/1000 - E.tEscalon) : null;
  $("dTiempo").textContent = dt === null ? "–" : Math.floor(dt/60) + ":" + String(dt%60).padStart(2,"0");
  const v = enCurso ? variacion() : null;
  $("dVar").textContent = v === null ? "–" : fmt(v, 3);
  // Barra de ruido de 100 a 0: 100 = 5 veces el umbral o más, 20 = el umbral.
  // Baja según se estabiliza; del rojo pasa al amarillo y, por debajo de 20, al verde.
  $("ruidoLimite").style.left = RUIDO_PASA + "%";
  let txt = enCurso ? "Ruido: midiendo (30 s)…" : "Ruido: –", col = "var(--txt)";
  if (v !== null) {
    const r = indiceRuido(v);
    const hue = r <= RUIDO_PASA ? 120 : 60 * (100 - r) / (100 - RUIDO_PASA);   // 100 → rojo, 20 → amarillo
    const c = r <= RUIDO_PASA ? "var(--verde)" : "hsl(" + hue.toFixed(0) + ",85%,45%)";
    $("ruidoNivel").style.width = Math.max(2, r) + "%"; $("ruidoNivel").style.background = c; col = c;
    txt = "Ruido " + r.toFixed(0) + (r <= RUIDO_PASA ? " · ESTABLE" : " · OSCILA") + " (" + fmt(v, 3) + " mm en 30 s)";
  } else { $("ruidoNivel").style.width = "0"; }
  $("ruidoTxt").textContent = txt; $("ruidoTxt").style.color = col;
  const estable = v !== null && v <= AJ.umbral && dt >= DURACION_S;
  const pp = enCurso ? puedePasar() : {ok:true};
  $("panel").className = !enCurso ? "" : (estable ? "estable" : "moviendo");
  if (estable && !pintar.avisado) { pintar.avisado = true; if (navigator.vibrate) navigator.vibrate([200,100,200]); }
  if (!estable) pintar.avisado = false;

  const g = $("grande");
  g.disabled = ultimo === null || E.escalon >= PROGRAMA.length || !pp.ok;
  if (E.escalon < 0) g.textContent = "Empezar: colgar 5 kg";
  else if (!pp.ok) g.textContent = "Esperando estabilidad…";
  else if (E.escalon < PROGRAMA.length - 1) g.textContent = "Siguiente: " + PROGRAMA[E.escalon+1] + " kg" + (pp.forzado ? " (sin estabilizar)" : estable ? " ✓" : "");
  else if (E.escalon === PROGRAMA.length - 1) g.textContent = "Terminar ensayo" + (pp.forzado ? " (sin estabilizar)" : "");
  else g.textContent = "Ensayo terminado";
  const bs = $("escalones").children;
  for (let k = 0; k < bs.length; k++) bs[k].className = k === E.escalon ? "actual" : (k < E.escalon ? "hecho" : "");
  $("avisoPaso").textContent = !enCurso ? "" : !pp.ok ? "No se puede pasar: " + pp.motivo + "."
    : pp.forzado ? "No se ha estabilizado en " + fmt(AJ.espera, AJ.espera % 1 ? 1 : 0) + " min: se puede pasar, y quedará anotado en el TXT." : "";
  $("bExportar").disabled = E.filas.length === 0;
  $("bAbortar").disabled = E.escalon < 0 && E.filas.length === 0;
  grafica();
}
function fmt(x, d){ return x.toFixed(d).replace(".", ","); }

PROGRAMA.forEach((kg, k) => {
  const b = document.createElement("button"); b.textContent = kg;
  b.onclick = () => { if (ultimo !== null && confirm("¿Pasar al escalón " + (k+1) + " (" + kg + " kg)?")) irAEscalon(k); };
  $("escalones").appendChild(b);
});

// ---------------------------------------------------------------- gráfica
function grafica(){
  const c = $("grafica"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext("2d"); x.scale(dpr, dpr);
  const W = r.width, H = r.height, f = E.filas;
  x.clearRect(0,0,W,H);
  if (f.length < 2) return;
  const t1 = f[f.length-1][0] || 1, base = E.cero === null ? f[0][2] : E.cero;
  const ys = f.map(p => p[2] - base); let lo = Math.min(0, ...ys), hi = Math.max(0.1, ...ys);
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const X = t => 30 + (W - 36) * t / t1, Y = v => H - 16 - (H - 24) * (v - lo) / (hi - lo);
  const col = getComputedStyle(document.body).color;
  x.fillStyle = col; x.font = "11px system-ui"; x.globalAlpha = .6;
  x.fillText(fmt(hi,2), 0, 12); x.fillText(fmt(lo,2), 0, H-18); x.fillText(t1 + " s", W-40, H-2);
  x.globalAlpha = 1; x.strokeStyle = "#2563eb"; x.lineWidth = 1.5; x.beginPath();
  f.forEach((p, i) => { const px = X(p[0]), py = Y(p[2] - base); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
}

// --------------------------------------------------------------- exportar
function nombreFichero(){
  const loc = ($("local").value || "").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,"");
  const obra = $("obra").value ? "O" + $("obra").value + "_" : "";
  return obra + "Prueba_Carga_Zona_" + ($("zona").value || "1") + (loc ? "_" + loc : "") + ".txt";
}
function texto(){
  const zona = $("zona").value || "1", loc = $("local").value || "";
  const L = ["# Zona " + zona + ": " + loc];
  if ($("obra").value) L.push("# Obra nº " + $("obra").value);
  L.push(
    "# Captador de flecha AlchiDat System ADS-T100 (" + (info || "sin INFO") + "); carga marcada a mano en el móvil");
  L.push(
    "# Cero de deformación " + (modoCero() === "30s" ? "a los " + CERO_S + " s de empezar el escalón de 5 kg" : "al finalizar la precarga de 5 kg") + (E.perdidas ? "; " + E.perdidas + " s sin lectura" : ""));
  L.push(
    "# Para pasar de escalón: ruido en 30 s <= " + fmt(AJ.umbral,3) + " mm, o " + fmt(AJ.espera, AJ.espera % 1 ? 1 : 0) + " min sin estabilizar");
  for (const [kg, n, r] of (E.forzados || []))
    L.push("# Escalón " + n + " (" + kg + " kg) pasado sin estabilizar" + (r === null || r === undefined ? "" : ": ruido en 30 s " + fmt(r,3) + " mm"));
  L.push("Tiempo_s;Fuerza_kg;Deformacion_mm");
  const cero = E.cero === null ? 0 : E.cero;
  for (const [t, kg, mm] of E.filas) {
    L.push(t + ";" + kg + ";" + fmt(precarga(t) ? 0 : mm - cero, 3));
  }
  return L.join("\r\n") + "\r\n";
}
// Antes de poner el cero la flecha se exporta a 0, como el DATALOG.
function precarga(t){
  if (E.tCero !== undefined && E.tCero !== null) return t < E.tCero;
  if (modoCero() !== "precarga") return false;
  const p = E.filas.find(r => r[1] !== 5); return p ? t < p[0] : true;
}

$("bExportar").onclick = async () => {
  const nombre = nombreFichero(), blob = new Blob([texto()], {type:"text/plain"});
  const fichero = new File([blob], nombre, {type:"text/plain"});
  if (navigator.canShare && navigator.canShare({files:[fichero]})) {
    try { await navigator.share({files:[fichero], title:nombre}); return; } catch(e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
};
$("bNuevo").onclick = () => {
  if (E.filas.length && !confirm("Se borra el registro de esta zona del móvil. ¿Lo has exportado?")) return;
  E = nuevoEnsayo(); $("zona").value = String((parseInt($("zona").value,10)||0) + 1); $("local").value = "";
  guardar(); cabGuardada = valorCab(); estadoCab(); pintar();
};
$("bAbortar").onclick = () => {
  if (E.escalon < 0 && !E.filas.length) return;
  if (!confirm("Se descarta el ensayo en curso de esta zona y vuelve a empezar desde 5 kg (sin cero). ¿Seguro?")) return;
  E = nuevoEnsayo(); pintar.avisado = false;
  guardar(); pintar();
};
["obra","zona","local"].forEach(id => $(id).addEventListener("change", guardar));
// Botón «Guardar datos»: confirma que el nº de obra, la zona y la localización
// están guardados (y por tanto irán al TXT). Avisa si se ha tocado algo sin guardar.
let cabGuardada = "";
const valorCab = () => ["obra","zona","local"].map(id => $(id).value.trim()).join("|");
function estadoCab(){
  const ok = valorCab() === cabGuardada;
  $("cabEstado").textContent = ok ? "✓ Guardados" : "Sin guardar";
  $("cabEstado").style.color = ok ? "var(--verde)" : "var(--ambar)";
  $("bCabecera").disabled = ok;
}
$("bCabecera").onclick = () => { guardar(); cabGuardada = valorCab(); estadoCab(); };
["obra","zona","local"].forEach(id => $(id).addEventListener("input", estadoCab));
setTimeout(() => { cabGuardada = valorCab(); estadoCab(); }, 50);
$("ruidoEscala").innerHTML = [100,80,60,40,20,0].map(n => '<span style="left:' + Math.min(97, Math.max(3, n)) + '%">' + n + '</span>').join("");
$("umbral").value = fmt(AJ.umbral, 3).replace(/0+$/,"").replace(/,$/,""); $("espera").value = fmt(AJ.espera, AJ.espera % 1 ? 1 : 0);
["umbral","espera"].forEach(id => $(id).addEventListener("change", () => {
  const x = num($(id).value); if (x !== null) AJ[id] = x;
  $(id).value = fmt(AJ[id], id === "umbral" ? 3 : AJ[id] % 1 ? 1 : 0);
  try { localStorage.setItem("flechaAjustes", JSON.stringify(AJ)); } catch(e){}
  pintar();
}));

// ------------------------------------------------------------------ demo
function demo(){
  conexion("Modo demostración"); info = "INFO;demo"; let s = 0, pos = 42;
  setInterval(() => {
    const kg = E.escalon >= 0 && E.escalon < PROGRAMA.length ? PROGRAMA[E.escalon] : 0;
    const objetivo = 42 + kg * 0.06 + (E.escalon >= 3 ? 0.15 : 0);
    pos += (objetivo - pos) * 0.08 + (Math.random() - .5) * 0.004;
    linea(s++ + ";" + (pos/100).toFixed(7) + ";" + pos.toFixed(4) + ";OK");
  }, 1000);
}

setInterval(pintar, 1000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
pintar();
</script>
